<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>AgenticOS Logo</title>
  <desc>AgenticOS icon mark — hexagonal multi-agent network within a circle, on transparent background</desc>

  <!-- Circular clip mask — everything outside the circle is transparent -->
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <!-- Dark background fill — clipped to circle -->
  <circle cx="100" cy="100" r="96" fill="#0D0D0D"/>

  <!-- All inner content clipped to circle -->
  <g clip-path="url(#circle-clip)">

    <!-- Outermost structural orbit ring -->
    <circle cx="100" cy="100" r="72" fill="none" stroke="#2563EB" stroke-width="0.6" stroke-opacity="0.22"/>

    <!-- Mid ring -->
    <circle cx="100" cy="100" r="56" fill="none" stroke="#2563EB" stroke-width="0.45" stroke-opacity="0.14"/>

    <!-- Hexagon frame at r=44 (top-point orientation) -->
    <!-- v0=(100,56) v1=(138.1,78) v2=(138.1,122) v3=(100,144) v4=(61.9,122) v5=(61.9,78) -->
    <!-- r=44, cos30=0.866, sin30=0.5 -->
    <!-- v1: 100+44*0.866=138.1, 100-44*0.5=78 ✓ -->
    <polygon
      points="100,56 138,78 138,122 100,144 62,122 62,78"
      fill="none"
      stroke="#2563EB"
      stroke-width="0.75"
      stroke-opacity="0.48"
      stroke-linejoin="miter"/>

    <!-- Inner hexagon at r=24 -->
    <polygon
      points="100,76 121,88 121,112 100,124 79,112 79,88"
      fill="none"
      stroke="#2563EB"
      stroke-width="0.5"
      stroke-opacity="0.2"
      stroke-linejoin="miter"/>

    <!-- Spokes — center to outer hex vertices -->
    <line x1="100" y1="100" x2="100" y2="56"  stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.22"/>
    <line x1="100" y1="100" x2="138" y2="78"  stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.22"/>
    <line x1="100" y1="100" x2="138" y2="122" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.22"/>
    <line x1="100" y1="100" x2="100" y2="144" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.22"/>
    <line x1="100" y1="100" x2="62"  y2="122" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.22"/>
    <line x1="100" y1="100" x2="62"  y2="78"  stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.22"/>

    <!-- Mesh cross-connections (dashed) — star pattern skip-1 -->
    <line x1="100" y1="56"  x2="138" y2="122" stroke="#2563EB" stroke-width="0.38" stroke-opacity="0.2" stroke-dasharray="3,4"/>
    <line x1="138" y1="122" x2="62"  y2="122" stroke="#2563EB" stroke-width="0.38" stroke-opacity="0.2" stroke-dasharray="3,4"/>
    <line x1="62"  y1="122" x2="138" y2="78"  stroke="#2563EB" stroke-width="0.38" stroke-opacity="0.2" stroke-dasharray="3,4"/>
    <line x1="138" y1="78"  x2="62"  y2="78"  stroke="#2563EB" stroke-width="0.38" stroke-opacity="0.2" stroke-dasharray="3,4"/>
    <line x1="62"  y1="78"  x2="100" y2="144" stroke="#2563EB" stroke-width="0.38" stroke-opacity="0.2" stroke-dasharray="3,4"/>
    <line x1="100" y1="144" x2="100" y2="56"  stroke="#2563EB" stroke-width="0.38" stroke-opacity="0.2" stroke-dasharray="3,4"/>

    <!-- Agent nodes at hex vertices -->
    <circle cx="100" cy="56"  r="5" fill="#2563EB"/>
    <circle cx="138" cy="78"  r="5" fill="#2563EB"/>
    <circle cx="138" cy="122" r="5" fill="#2563EB"/>
    <circle cx="100" cy="144" r="5" fill="#2563EB"/>
    <circle cx="62"  cy="122" r="5" fill="#2563EB"/>
    <circle cx="62"  cy="78"  r="5" fill="#2563EB"/>

    <!-- Agent node halos -->
    <circle cx="100" cy="56"  r="9.5" fill="none" stroke="#2563EB" stroke-width="0.7" stroke-opacity="0.32"/>
    <circle cx="138" cy="78"  r="9.5" fill="none" stroke="#2563EB" stroke-width="0.7" stroke-opacity="0.32"/>
    <circle cx="138" cy="122" r="9.5" fill="none" stroke="#2563EB" stroke-width="0.7" stroke-opacity="0.32"/>
    <circle cx="100" cy="144" r="9.5" fill="none" stroke="#2563EB" stroke-width="0.7" stroke-opacity="0.32"/>
    <circle cx="62"  cy="122" r="9.5" fill="none" stroke="#2563EB" stroke-width="0.7" stroke-opacity="0.32"/>
    <circle cx="62"  cy="78"  r="9.5" fill="none" stroke="#2563EB" stroke-width="0.7" stroke-opacity="0.32"/>

    <!-- Central orchestrator node — Manager agent -->
    <circle cx="100" cy="100" r="11"  fill="#0D0D0D" stroke="#FFFFFF" stroke-width="1.3"/>
    <circle cx="100" cy="100" r="4.2" fill="#FFFFFF"/>
    <circle cx="100" cy="100" r="15"  fill="none" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.18"/>

    <!-- Precision tick marks on outer orbit ring (r=72) -->
    <!-- Major ticks at cardinal points (N/E/S/W) — longer -->
    <line x1="100" y1="23"  x2="100" y2="31"  stroke="#2563EB" stroke-width="1.3" stroke-opacity="0.55"/>
    <line x1="177" y1="100" x2="169" y2="100" stroke="#2563EB" stroke-width="1.3" stroke-opacity="0.55"/>
    <line x1="100" y1="177" x2="100" y2="169" stroke="#2563EB" stroke-width="1.3" stroke-opacity="0.55"/>
    <line x1="23"  y1="100" x2="31"  y2="100" stroke="#2563EB" stroke-width="1.3" stroke-opacity="0.55"/>

    <!-- Minor ticks at 30° intervals (the remaining 8 of 12) -->
    <!-- at 30°: x=100+72*cos(30°-90°)=100+72*sin(30°)=136, y=100-72*cos(30°)=100-62.4=37.6 -->
    <!-- Computed at r=72 outer, r=68 inner: -->
    <line x1="136" y1="38"  x2="133" y2="41"  stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="162" y1="64"  x2="159" y2="67"  stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="162" y1="136" x2="159" y2="133" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="136" y1="162" x2="133" y2="159" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="64"  y1="162" x2="67"  y2="159" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="38"  y1="136" x2="41"  y2="133" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="38"  y1="64"  x2="41"  y2="67"  stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="64"  y1="38"  x2="67"  y2="41"  stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>

  </g>

  <!-- White ring at the edge of the circle — drawn on top, outside clip -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

</svg>